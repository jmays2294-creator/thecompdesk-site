<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your personal dashboard for workers compensation tools and features.">
    <title>Dashboard — The Comp Desk</title>
<meta name="robots" content="noindex, nofollow">
    <!-- Page chrome (unchanged) -->
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="/css/skins.css">
    <!-- Brand theme overlay (brand_guidelines.md v1.0.0) -->
    <link rel="stylesheet" href="/css/brand-theme.css">
    <script src="/js/brand-bg.js" defer></script>

    <!-- ── SHARED DASHBOARD (single source of truth: the native app) ──────────
         The worker & attorney dashboards are authored once in www/js/dashboard/
         and vendored here by ops/website/sync-dashboard.sh. The --skin-*/
         --rhythm-* tokens they consume live in skins.css (already loaded above);
         dashboard-worker.css / dashboard-attorney.css carry the wd-* / atty-*
         rules. See ops/website/CLAUDE.md "Shared Dashboard". -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Geist:wght@500;600;700;800&display=swap">
    <link rel="stylesheet" href="/css/dashboard-worker.css">
    <link rel="stylesheet" href="/css/dashboard-attorney.css">
    <link rel="stylesheet" href="/css/job-buddy.css">
    <link rel="stylesheet" href="/css/job-buddy-wizard.css">
    <style>
      /* The shared dashboard owns its own surface; give it room and let its skin
         (worker cream / attorney navy, set via <html data-audience>) show.
         The .wd-*/.atty-* skins are sized for the app's narrow phone webview, so
         on a wide desktop browser we constrain the mount to a comfortable,
         centered reading column instead of letting it stretch edge-to-edge
         (which reads as oversized/aggressive). App is unaffected — this lives in
         the web-only mount page, not the shared dashboard CSS. */
      #dashRoot {
        min-height: 60vh;
        max-width: 1040px;
        margin: 0 auto;
        padding: 28px 24px 56px;
      }
      @media (max-width: 640px) { #dashRoot { padding: 16px 16px 40px; } }
      #dashLoading {
        max-width: 680px; margin: 64px auto; padding: 0 20px; text-align: center;
        color: var(--skin-text-muted, #7A8095);
        font-family: var(--font-body, 'DM Sans', system-ui, sans-serif);
      }
    </style>
</head>
<body class="tcd-skinned" data-no-brand-bg="true">
  <nav class="tcd-nav" aria-label="Primary">
    <div class="tcd-nav-inner">
      <a class="tcd-wordmark" href="/?replay=1" aria-label="The Comp Desk">The <span class="accent">Comp</span> Desk</a>
      <div class="tcd-nav-links">
        <a href="/attorneys">Attorneys</a>
        <a href="/calculators">Calculators</a>
        <a href="/workspace/">Workspace</a>
        <a href="/subscribe">Subscribe</a>
      </div>
    </div>
  </nav>

  <!-- The SAME dashboard module the app renders mounts here, chosen by the
       signed-in user's designation (worker → injured-worker dashboard,
       attorney → attorney dashboard). -->
  <main>
    <div id="dashRoot">
      <div id="dashLoading">Loading your dashboard…</div>
    </div>
  </main>

  <!-- Footer Disclaimer -->
  <div id="disclaimerFooter"></div>

  <!-- Shared dashboard modules (vendored from www/ — classic IIFEs on window.CD).
       Order: data-store (CD.S + statutory MAX_RATES) → dashboards → host. -->
  <script src="/js/dashboard/data-store.js" defer></script>
  <script src="/js/uploads/evidence-uploader.js" defer></script>
  <script src="/js/mt/mt-tracker.js" defer></script>
  <script src="/js/mt/c257-pdf.js" defer></script>
  <script src="/js/evidence/accident-notice.js" defer></script>
  <script src="/js/dashboard/comp-buddy-intake.js" defer></script>
  <script src="/js/dashboard/c3-wizard.js" defer></script>
  <!-- Session 2: AWW Wizard (single source in www/js/dashboard/, vendored here
       by sync-dashboard.sh; host mounts CD.AWWWizard in-place) -->
  <script src="/js/dashboard/aww-wizard.js" defer></script>
  <!-- Feature Web Port: IME Reminders (single source in www/js/, vendored here
       by sync-dashboard.sh; host mounts CD.renderIMEReminders in-place) -->
  <script src="/js/dashboard/ime-reminders.js" defer></script>
  <script src="/js/dashboard/worker-dashboard.js" defer></script>
  <script src="/js/dashboard/attorney-dashboard.js" defer></script>
  <script src="/js/dashboard-host.js" defer></script>
  <!-- Job Buddy screens (worker + firm), mounted in-place by dashboard-host showScreen -->
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js" defer></script>
  <script src="/js/calc-core.js" defer></script>
  <script src="/js/job-buddy/job-buddy-wizard.js" defer></script>
  <script src="/js/job-buddy/job-buddy.js" defer></script>
  <script src="/js/job-buddy/firm-job-buddy.js" defer></script>

  <!-- Page bootstrap: keep the web's Supabase auth + tier gating; only the
       dashboard RENDER layer is shared. -->
  <script type="module">
    import { getUser, getProfile, supabase } from '../js/auth.js';
    import { renderFooterDisclaimer } from '../js/nav.js';

    // The vendored dashboards + host are classic deferred scripts; wait until
    // the host is on window (decouples us from defer-vs-module ordering).
    function whenHostReady() {
      return new Promise((resolve) => {
        if (window.CDDashboardHost) return resolve(window.CDDashboardHost);
        let tries = 0;
        const t = setInterval(() => {
          if (window.CDDashboardHost || tries++ > 150) { // ~3s ceiling
            clearInterval(t);
            resolve(window.CDDashboardHost || null);
          }
        }, 20);
      });
    }

    async function initDashboard() {
      // requireAuth() inside getUser() redirects to /auth_v2.html if signed out.
      const user = await getUser();
      if (!user) return;
      const { session, tier } = user;

      // Footer disclaimer (page chrome, unchanged).
      const footer = document.getElementById('disclaimerFooter');
      if (footer) footer.innerHTML = renderFooterDisclaimer();

      // Profile drives worker-vs-attorney (designation) — fail-loud inside.
      const profile = await getProfile(session.user.id);

      const host = await whenHostReady();
      if (!host) {
        console.error('[dashboard] shared dashboard host failed to load');
        const root = document.getElementById('dashRoot');
        if (root) root.innerHTML =
          '<div id="dashLoading">Dashboard failed to load. Please refresh.</div>';
        return;
      }

      host.mount(document.getElementById('dashRoot'), {
        user: session.user,
        profile,
        tier,
        supabase   // lets the worker AWW editor persist to profiles, like the app
      });
    }

    initDashboard().catch((err) => {
      console.error('Dashboard initialization failed:', err);
    });
  </script>

  <script src="/js/footer-contact.js" defer></script>
  <script type="module" src="/js/nav-account.js"></script>
</body>
</html>
