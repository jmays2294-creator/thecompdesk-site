<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Favicon / app icons -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
  <title>Pro Suite has moved — The Comp Desk Workspace</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="The Pro Attorney Calculator Suite is now the Pro Attorney Workspace at /workspace/. Every calculator on one canvas — free for every attorney.">

  <!-- Canonical points to the new home -->
  <link rel="canonical" href="https://thecompdesk.com/workspace/">

  <!-- Defense-in-depth: client-side redirect in case the Vercel 301 is bypassed (e.g., local preview) -->
  <meta http-equiv="refresh" content="0; url=/workspace/">

  <link rel="stylesheet" href="../css/app.css">
  <style>
    .moved-wrap {
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
    }
    .moved-card {
      max-width: 540px;
      width: 100%;
      background: var(--card, #0e1322);
      border: 1px solid rgba(45, 212, 160, 0.35);
      border-radius: 14px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }
    .moved-badge {
      display: inline-block;
      background: rgba(45, 212, 160, 0.12);
      color: #2dd4a0;
      border: 1px solid rgba(45, 212, 160, 0.3);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    .moved-card h1 {
      font-size: 28px;
      font-weight: 800;
      color: #f4f6fa;
      margin-bottom: 10px;
      line-height: 1.2;
    }
    .moved-card p {
      font-size: 15px;
      color: #8899b4;
      line-height: 1.6;
      margin-bottom: 22px;
    }
    .moved-card .moved-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #2dd4a0;
      color: #06201a;
      padding: 12px 22px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 14px;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .moved-card .moved-cta:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(45, 212, 160, 0.3);
      text-decoration: none;
    }
    .moved-card .moved-secondary {
      display: block;
      margin-top: 16px;
      font-size: 13px;
      color: #5a6a82;
    }
    .moved-card .moved-secondary a {
      color: #8899b4;
    }
  </style>
<!-- Brand theme overlay (brand_guidelines.md v1.0.0) -->
<link rel="stylesheet" href="/css/brand-theme.css">
<script src="/js/brand-bg.js" defer></script>
  <script src="/js/workspace-telemetry.js"></script>
</head>
<body>
  <div id="app-nav"></div>

  <main class="moved-wrap">
    <div class="moved-card" role="status" aria-live="polite">
      <div class="moved-badge">We've moved</div>
      <h1>The Pro Suite is now the Pro Attorney Workspace.</h1>
      <p>Every calculator on one canvas. Drag, drop, switch between cases. AWW once, every tile updates — free for every attorney.</p>
      <a href="/workspace/" class="moved-cta">Open the Workspace →</a>
      <span class="moved-secondary">Not redirecting automatically? <a href="/workspace/">Go to /workspace/</a></span>
    </div>
  </main>

  <script>
    // Belt-and-suspenders: if the meta refresh is blocked, push the redirect via JS.
    setTimeout(function () {
      if (window.location.pathname.indexOf('/workspace') === -1) {
        window.location.replace('/workspace/');
      }
    }, 100);
  </script>

  <script type="module">
    import { getOptionalUser } from '/js/auth.js';
    import { renderPublicNav } from '/js/nav.js';

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const user = await getOptionalUser();
        renderPublicNav(user);
      } catch (e) {
        // Nav is non-critical on the moved page — fail silently.
      }
    });
  </script>
  <script src="/js/footer-contact.js" defer></script>
  <script src="/js/header-attorney-cta.js" defer></script>
</body>
</html>
