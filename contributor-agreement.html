<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contributor Agreement — The Comp Desk Builder Platform</title>
<style>
  :root{--bg:#0B1426;--panel:#0F1B33;--panel2:#151d30;--line:#1c2d4a;--ink:#eef3fb;--body:#c4cee0;
    --muted:#8899b4;--faint:#5a6a82;--orange:#E87722;--green:#2dd4a0;--blue:#3b82f6;--red:#ff6b6b;}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--body);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;}
  a{color:var(--orange);text-decoration:none}a:hover{text-decoration:underline}
  .header{background:var(--bg);border-bottom:3px solid var(--orange);position:sticky;top:0;z-index:10}
  .header .inner{max-width:880px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .wm{color:#fff;font-size:20px;font-weight:700}.wm .dot{color:var(--orange)}.wm .sub{color:var(--muted);font-size:13px;font-weight:500;margin-left:8px}
  .who{color:var(--muted);font-size:13px}
  .wrap{max-width:880px;margin:0 auto;padding:34px 24px 90px}
  h1{color:#fff;font-size:27px;line-height:1.2;margin:0 0 6px}
  .lede{color:var(--muted);font-size:15px;margin:0 0 26px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px 28px;margin:0 0 20px}
  h2{color:#fff;font-size:17px;margin:26px 0 8px;padding-top:6px;border-top:1px solid var(--line)}
  h2:first-child{border-top:none;padding-top:0;margin-top:0}
  p{margin:8px 0}.sec{color:var(--green);font-weight:700}
  label{display:block;color:var(--ink);font-size:13px;font-weight:600;margin:14px 0 5px}
  input,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:#fff;
    font-size:15px;padding:11px 13px;font-family:inherit}
  textarea{min-height:78px;resize:vertical}
  input:focus,textarea:focus{outline:none;border-color:var(--orange)}
  .btn{display:inline-block;border:none;border-radius:9px;padding:13px 26px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn-primary{background:var(--orange);color:var(--bg)}.btn-primary:hover{filter:brightness(1.08)}
  .btn-ghost{background:transparent;border:1px solid var(--faint);color:var(--body)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}
  .steps{display:flex;gap:8px;margin-bottom:22px}
  .steps .s{flex:1;height:5px;border-radius:3px;background:var(--panel2)}
  .steps .s.on{background:var(--orange)}
  .ack{display:flex;gap:10px;align-items:flex-start;margin:18px 0;color:var(--body);font-size:14px}
  .ack input{width:18px;height:18px;margin-top:2px;flex:none}
  .banner{border-radius:10px;padding:14px 18px;margin-bottom:18px;font-size:14px}
  .banner.ok{background:#11261d;border:1px solid var(--green);color:#bdebd7}
  .banner.err{background:#2a1518;border:1px solid var(--red);color:#ffc9c9}
  .pill{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:12px;color:var(--muted);margin-bottom:16px}
  .doc .sec{color:var(--green)}.doc h2{font-size:16px}
  .merge{color:#fff;font-weight:600;background:rgba(232,119,34,.14);border-radius:4px;padding:0 4px}
  .sig{display:flex;gap:24px;flex-wrap:wrap;margin-top:8px}
  .sig .block{flex:1;min-width:230px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
  .sig .ln{color:#fff;font-weight:700;border-bottom:1px solid var(--faint);padding-bottom:6px;margin-bottom:6px;min-height:24px}
  .sig .lab{color:var(--muted);font-size:12px}
  .hide{display:none}
  .muted{color:var(--muted);font-size:13px}
  .callout{background:#11203a;border:1px solid var(--green);border-radius:12px;padding:18px 20px;margin:16px 0}
  .split{display:flex;gap:10px;margin-top:12px}.split>div{flex:1;text-align:center;border-radius:8px;padding:12px 8px;color:var(--bg);font-weight:700}
  .split .you{background:var(--green)}.split .tcd{background:var(--orange)}.split .pct{font-size:24px;line-height:1}.split .lbl{font-size:11px;margin-top:3px}
</style>
</head>
<body>
  <div class="header"><div class="inner">
    <span class="wm">The Comp Desk<span class="dot">.</span><span class="sub">Builder Platform</span></span>
    <span class="who" id="who"></span>
  </div></div>
  <div class="wrap" id="wrap"><div class="card"><p class="muted">Loading…</p></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://ltibymvlytodkemdeeox.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0aWJ5bXZseXRvZGtlbWRlZW94Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4MjA1NjYsImV4cCI6MjA5MDM5NjU2Nn0.b5oQqQIdgJRc0DEP2k7kMVdCRzfyfnuAwjVNZlbVyak";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const AGREEMENT_VERSION = "v1";
const wrap = document.getElementById('wrap');
const whoEl = document.getElementById('who');
let state = { name:"", address:"", signedName:"", ack:false };

const esc = s => String(s==null?"":s).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
const fmtDate = d => new Date(d).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});

// ---- Full agreement body (merge: NAME, ADDRESS, DATE) -------------------
function agreementHTML(name, address, dateLabel){
  const N = `<span class="merge">${esc(name)||'[Contributor name]'}</span>`;
  const A = `<span class="merge">${esc(address)||'[Contributor address]'}</span>`;
  const D = `<span class="merge">${esc(dateLabel)}</span>`;
  return `
  <div class="doc">
  <div style="background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:18px;font-size:14px">
    Entered into and effective as of ${D} (the "Effective Date") between <b style="color:#fff">NJJ Document Services, Inc.</b>,
    a New York corporation, 26 Post Avenue, 4, New York, New York (the "Company"), and ${N}, ${A}, an attorney admitted in New York
    (the "Contributor"). A software/services contract — <b>not</b> an agreement for the practice of law; The Comp Desk Law / Mays Law PLLC is not a party.
  </div>
  <h2>Recitals</h2>
  <p><b>A.</b> The Company operates The Comp Desk, a software platform for NYS workers' compensation professionals and injured workers.
  <b>B.</b> It operates a sandboxed Builder Platform for approved contributors to build calculators/tiles and Claude skills.
  <b>C.</b> The Contributor wishes to build such contributions and the Company will grant access on these terms.
  <b>D.</b> This is a software/services contract; it creates no partnership and no sharing of legal fees, and nothing here affects either Party's obligations under the NY Rules of Professional Conduct ("RPC").</p>

  <h2>1. Definitions</h2>
  <p><span class="sec">1.1–1.9</span> "Calculator," "Skill," "Contribution," "Work Product," "Intellectual Property Rights," "Approved Skill" (a Skill the Company has published and that is generating revenue), "Confidential Information," "PHI / Client Data," and "Net Skill Profit" (Section 5.2) have the meanings given them in this Agreement.</p>

  <h2>2. Scope; Sandbox Use; Access</h2>
  <p><span class="sec">2.1</span> Personal, non-exclusive, revocable right to use the Builder Platform to create Contributions; the Company issues a unique API key the Contributor keeps confidential and is liable for. <span class="sec">2.2</span> Sandbox only — no access to production systems, live data, PHI/Client Data, or another contributor's work. <span class="sec">2.3</span> No authority to bind the Company.</p>
  <p><span class="sec">2.4 Original work only; own professional experience.</span> The Contributor shall build only original, license-clean material drawn from the Contributor's <b>own professional knowledge and experience</b>, and shall not incorporate, replicate, adapt, or derive any Contribution from the proprietary, confidential, or trade-secret intellectual property, materials, code, tools, or work product of any other organization, including any current or former employer or client. No third-party/open-source code except as disclosed to and approved by the Company in advance, in writing.</p>

  <h2>3. Ownership of Work Product</h2>
  <p><span class="sec">3.1</span> All Work Product is work made for hire for the Company. <span class="sec">3.2</span> To the extent it is not, the Contributor hereby irrevocably <b>assigns to the Company</b> all right, title, and interest in it, including derivative/improvement rights. <span class="sec">3.3</span> Moral rights waived where permitted. <span class="sec">3.4</span> Further-assurances + attorney-in-fact. <span class="sec">3.5</span> No license-back except as separately granted in writing.</p>

  <h2>4. Approval, Publication & Removal</h2>
  <p><span class="sec">4.1</span> The Company may approve, reject, modify, delay, publish, decline to publish, or remove any Contribution at its sole discretion. <span class="sec">4.2</span> Nothing reaches production without the Company's approval. <span class="sec">4.3</span> No compensation accrues on rejected/unpublished/removed work except as Section 5 states.</p>

  <h2>5. Compensation — Skill Revenue Share</h2>
  <p><span class="sec">5.1</span> As sole compensation, the Company pays the Contributor <b>90% of the Net Skill Profit</b> generated each month by the Contributor's Approved Skills and retains <b>10%</b>. <b>Calculators are not revenue-shared.</b></p>
  <p><span class="sec">5.2 Net Skill Profit</span> = that Skill's gross revenue actually received by the Company and attributable to it, less its pro-rata share (by its share of total Approved-Skill gross revenue that month) of: (a) domain &amp; operating costs; (b) payment-processing fees; (c) infrastructure (The Comp Desk memory/storage + apportioned Claude API tokens).</p>
  <p><span class="sec">5.3</span> Statement + payment within 30 days of month-end; optional $25 minimum payout threshold. <span class="sec">5.4 Software revenue only; no legal fees or referral fees</span> — these amounts are for software/services and are <b>not</b> a share of legal fees, attorney compensation, referral fees, or proceeds of the practice of law, and are not contingent on or derived from any client/matter of The Comp Desk Law, PLLC, Mays Law PLLC, or any law firm, or any client referral. <span class="sec">5.5</span> Taxes are the Contributor's. <span class="sec">5.6</span> Prospective changes only; this Section controls over any summary.</p>
  <div class="callout">
    <div style="color:var(--green);font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">How the split works</div>
    <p style="margin:0;color:var(--body)">Gross revenue from your Approved Skill − its pro-rata operating/processing/infrastructure costs = <b style="color:#fff">Net Skill Profit</b>.</p>
    <div class="split"><div class="you"><div class="pct">90%</div><div class="lbl">to you (builder)</div></div><div class="tcd"><div class="pct">10%</div><div class="lbl">to The Comp Desk</div></div></div>
  </div>

  <h2>6. Confidentiality & PHI Prohibition</h2>
  <p><span class="sec">6.1</span> The Contributor shall <b>not</b> access, request, store, use, or incorporate any PHI/Client Data, and shall not use real client/case/injured-worker data to build or test — only synthetic or properly de-identified, license-clean data. <span class="sec">6.2</span> Confidentiality of the Company's non-public information survives termination. <span class="sec">6.3</span> Prompt incident reporting.</p>

  <h2>7. Representations & Warranties</h2>
  <p>The Contributor warrants: (a) each Contribution is original, from the Contributor's own professional experience; (b) none infringes third-party IP / is free of undisclosed open-source encumbrances; (c) none contains PHI/Client Data; (d) authority to enter and assign; (e) no conflict with any agreement, offer letter, or policy of the Contributor's employer; (f) no Contribution incorporates or derives from the proprietary IP of any other organization (current/former employer or client).</p>

  <h2>8. Relationship of the Parties</h2>
  <p><span class="sec">8.1</span> Independent contractor; no employment, partnership, or agency. <span class="sec">8.2 No fee-sharing; outside the practice of law (emphasized).</span> The Contributor and Joel Mays, Esq. are presently at the same firm (Shulman &amp; Hill, PLLC); this activity is a software contribution outside the practice of law. Nothing constitutes (a) sharing/division of legal fees, a referral fee, a law partnership, or non-lawyer ownership of any law practice; (b) any compensation paid by, contingent on, or derived from The Comp Desk Law, PLLC, Mays Law PLLC, Shulman &amp; Hill, PLLC, or any law firm, client, matter, settlement, recovery, or client referral; and (c) the Company holds no interest in any law firm. Construed to comply with RPC 5.4 and 1.5. <span class="sec">8.3</span> No attorney-client relationship is created.</p>

  <h2>9–14. Term, Materials, Indemnity, Liability, Governing Law, Misc.</h2>
  <p><span class="sec">9</span> Either Party may terminate any time on written notice; the Company may suspend access immediately for suspected breach; Sections 3, 5 (accrued amounts), 6, 7, 8, 10–14 survive. <span class="sec">10</span> Return/delete materials on termination. <span class="sec">11</span> Contributor indemnifies for breach of §2.4, §6, §7. <span class="sec">12</span> Platform "as is"; liability cap = Section 5 amounts in the prior 12 months. <span class="sec">13</span> Governed by New York law; exclusive venue <b>New York County, New York</b>; RPC controls where implicated. <span class="sec">14</span> Entire agreement; amendments in writing; Contributor may not assign; severability; counterparts/e-signature.</p>

  <h2>Exhibit A — Skill Revenue Share Calculation</h2>
  <p class="muted">For explanation only; Section 5 controls.</p>
  <p>Gross revenue → less the skill's pro-rata program costs (domain/operating, processing, infrastructure) → Net Skill Profit → <b style="color:var(--green)">90% to you</b>, <b style="color:var(--orange)">10% to the Company</b>. Example: $1,000 gross − $200 costs = $800 → $720 to you / $80 to the Company. Calculators earn no revenue share.</p>
  </div>`;
}

function signatureBlock(name, dateLabel){
  return `<div class="sig">
    <div class="block"><div class="lab">Company</div><div class="ln">NJJ Document Services, Inc.</div>
      <div class="lab">By: Joel Mays · CEO / President</div></div>
    <div class="block"><div class="lab">Contributor</div><div class="ln">${esc(name)||'—'}</div>
      <div class="lab">Effective date: ${esc(dateLabel)}</div></div>
  </div>`;
}

// ---------- views ----------
function render(html){ wrap.innerHTML = html; }

function viewLogin(msg){
  whoEl.textContent = "";
  render(`<div class="card" style="max-width:440px;margin:30px auto">
    <span class="pill">Builder Platform</span>
    <h1 style="font-size:22px">Sign in to review your agreement</h1>
    <p class="lede">Use your Comp Desk login. Your signed agreement is saved to your account, so you can return and read it anytime.</p>
    ${msg?`<div class="banner err">${esc(msg)}</div>`:""}
    <label>Email</label><input id="email" type="email" autocomplete="username" placeholder="you@example.com">
    <label>Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
    <div class="row"><button class="btn btn-primary" id="loginBtn">Sign in</button></div>
  </div>`);
  document.getElementById('loginBtn').onclick = doLogin;
  document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
}
async function doLogin(){
  const email=document.getElementById('email').value.trim();
  const pw=document.getElementById('pw').value;
  const btn=document.getElementById('loginBtn'); btn.disabled=true; btn.textContent="Signing in…";
  const {error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error){ viewLogin(error.message); return; }
  boot();
}

function viewSigned(rec){
  const dateLabel = fmtDate(rec.effective_date);
  render(`<div class="card">
    <div class="banner ok">✓ You signed the Contributor &amp; IP Agreement (${esc(rec.agreement_version)}) on <b>${esc(fmtDate(rec.signed_at))}</b>. This is your saved copy — read it anytime.</div>
    <span class="pill">Executed copy</span>
    <h1>Contributor &amp; Intellectual-Property Agreement</h1>
    <p class="lede">Signed by ${esc(rec.full_legal_name)} · Effective ${esc(dateLabel)}</p>
    ${agreementHTML(rec.full_legal_name, rec.mailing_address, dateLabel)}
    <h2>Signatures</h2>${signatureBlock(rec.signed_name, dateLabel)}
    <div class="row"><button class="btn btn-ghost" onclick="window.print()">Print / Save PDF</button>
      <button class="btn btn-ghost" id="out">Sign out</button></div>
  </div>`);
  document.getElementById('out').onclick=async()=>{await sb.auth.signOut();boot();};
}

function viewStep1(){
  render(`<div class="card">
    <div class="steps"><div class="s on"></div><div class="s"></div><div class="s"></div></div>
    <span class="pill">Step 1 of 3 · Your details</span>
    <h1>Before you review the agreement</h1>
    <p class="lede">Enter your legal name and mailing address as they should appear on the executed agreement. The effective date will be the day you sign.</p>
    <label>Full legal name</label><input id="f_name" type="text" placeholder="Jane Q. Attorney" value="${esc(state.name)}">
    <label>Mailing address</label><textarea id="f_addr" placeholder="Street, City, State ZIP">${esc(state.address)}</textarea>
    <div class="row"><button class="btn btn-primary" id="next1">Continue to review</button></div>
  </div>`);
  document.getElementById('next1').onclick=()=>{
    state.name=document.getElementById('f_name').value.trim();
    state.address=document.getElementById('f_addr').value.trim();
    if(!state.name||!state.address){alert("Please enter your full legal name and mailing address.");return;}
    viewStep2();
  };
}

function viewStep2(){
  const dateLabel = fmtDate(new Date());
  render(`<div class="card">
    <div class="steps"><div class="s on"></div><div class="s on"></div><div class="s"></div></div>
    <span class="pill">Step 2 of 3 · Review</span>
    <h1>Review the full agreement</h1>
    <p class="lede">Read it in full. Your details are merged below; the effective date is today, ${esc(dateLabel)}.</p>
    ${agreementHTML(state.name, state.address, dateLabel)}
    <h2>Signatures</h2>${signatureBlock(state.name, dateLabel)}
    <div class="row"><button class="btn btn-ghost" id="back2">Back</button>
      <button class="btn btn-primary" id="next2">Continue to sign</button></div>
  </div>`);
  document.getElementById('back2').onclick=viewStep1;
  document.getElementById('next2').onclick=viewStep3;
}

function viewStep3(err){
  const dateLabel = fmtDate(new Date());
  render(`<div class="card" style="max-width:560px;margin:0 auto">
    <div class="steps"><div class="s on"></div><div class="s on"></div><div class="s on"></div></div>
    <span class="pill">Step 3 of 3 · Sign</span>
    <h1>Sign &amp; save</h1>
    <p class="lede">Signing creates your executed copy, effective today (${esc(dateLabel)}).</p>
    ${err?`<div class="banner err">${esc(err)}</div>`:""}
    <label class="ack"><input type="checkbox" id="ack"> I have read the Contributor &amp; IP Agreement in full, I am ${esc(state.name)}, and I agree to be bound by it. I understand my contributions are assigned to NJJ Document Services, Inc. and that this is not the sharing of legal fees.</label>
    <label>Type your full legal name to sign</label><input id="sig" type="text" placeholder="${esc(state.name)}">
    <div class="row"><button class="btn btn-ghost" id="back3">Back</button>
      <button class="btn btn-primary" id="signBtn">Sign &amp; save agreement</button></div>
  </div>`);
  document.getElementById('back3').onclick=viewStep2;
  document.getElementById('signBtn').onclick=doSign;
}

async function doSign(){
  const ack=document.getElementById('ack').checked;
  const sig=document.getElementById('sig').value.trim();
  if(!ack){viewStep3("Please check the acknowledgment box to continue.");return;}
  if(!sig){viewStep3("Type your full legal name to sign.");return;}
  const btn=document.getElementById('signBtn'); btn.disabled=true; btn.textContent="Saving…";
  const {data,error}=await sb.rpc('sign_contributor_agreement',{
    p_full_name:state.name, p_address:state.address, p_signed_name:sig, p_version:AGREEMENT_VERSION
  });
  if(error){
    let m=error.message||"Could not save.";
    if(/builder/i.test(m)) m="Your account isn't an active builder yet. Ask Joel to grant you builder access, then return here to sign.";
    viewStep3(m); return;
  }
  viewSigned(Array.isArray(data)?data[0]:data);
}

// ---------- boot ----------
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ viewLogin(); return; }
  whoEl.textContent = session.user.email;
  // prefill name from metadata if present
  state.name = state.name || session.user.user_metadata?.full_name || "";
  const {data,error}=await sb.from('contributor_agreements').select('*').eq('contributor_id',session.user.id).maybeSingle();
  if(error){ render(`<div class="card"><div class="banner err">Couldn't load your agreement: ${esc(error.message)}</div></div>`); return; }
  if(data){ viewSigned(data); } else { viewStep1(); }
}
boot();
</script>
</body>
</html>
