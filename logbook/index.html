<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builder Earnings Logbook — The Comp Desk</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#0B1426;--panel:#0F1B33;--panel2:#151d30;--line:#1c2d4a;--ink:#eef3fb;--body:#c4cee0;
    --muted:#8899b4;--faint:#5a6a82;--orange:#E87722;--green:#2dd4a0;--blue:#3b82f6;--red:#ff6b6b;--amber:#f0a030;}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--body);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .header{background:var(--bg);border-bottom:3px solid var(--orange);position:sticky;top:0;z-index:10}
  .header .inner{max-width:960px;margin:0 auto;padding:15px 22px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .wm{color:#fff;font-size:19px;font-weight:700}.wm .dot{color:var(--orange)}.wm .sub{color:var(--muted);font-size:13px;font-weight:500;margin-left:8px}
  .who{color:var(--muted);font-size:13px}
  .wrap{max-width:960px;margin:0 auto;padding:26px 22px 90px}
  h1{color:#fff;font-size:24px;margin:0 0 4px}.lede{color:var(--muted);font-size:14px;margin:0 0 22px}
  h2{color:#fff;font-size:16px;margin:26px 0 10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin:0 0 14px}
  label{display:block;color:var(--ink);font-size:13px;font-weight:600;margin:12px 0 5px}
  input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:#fff;font-size:14px;padding:10px 12px;font-family:inherit}
  input:focus{outline:none;border-color:var(--orange)}
  .btn{border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;background:var(--orange);color:var(--bg)}
  .btn-ghost{background:transparent;border:1px solid var(--faint);color:var(--body)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .banner{border-radius:9px;padding:12px 15px;margin-bottom:14px;font-size:13px}
  .banner.err{background:#2a1518;border:1px solid var(--red);color:#ffc9c9}
  .banner.warn{background:#2a2410;border:1px solid #6a5a18;color:var(--amber)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:8px}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:14px 16px}
  .stat .v{color:#fff;font-size:22px;font-weight:700}
  .stat .v.g{color:var(--green)}.stat .v.o{color:var(--orange)}
  .stat .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700}
  .pill.accrued{background:#2a2410;color:var(--amber)} .pill.paid{background:#11261d;color:var(--green)}
  .pill.carried{background:#10233f;color:#7fb0ff} .pill.held,.pill.pending{background:#2a1518;color:#ffc9c9}
  .muted{color:var(--muted);font-size:13px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px}
  .seg button{background:var(--panel2);color:var(--muted);border:none;padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit}
  .seg button.on{background:var(--orange);color:var(--bg);font-weight:700}
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-P1DQTVSWSM"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-P1DQTVSWSM');
</script>
</head>
<body>
  <div class="header"><div class="inner">
    <span class="wm">The Comp Desk<span class="dot">.</span><span class="sub">Builder Earnings Logbook</span></span>
    <span class="who" id="who"></span>
  </div></div>
  <div class="wrap" id="wrap"><div class="card"><p class="muted">Loading…</p></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://ltibymvlytodkemdeeox.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0aWJ5bXZseXRvZGtlbWRlZW94Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4MjA1NjYsImV4cCI6MjA5MDM5NjU2Nn0.b5oQqQIdgJRc0DEP2k7kMVdCRzfyfnuAwjVNZlbVyak";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const wrap = document.getElementById('wrap'), whoEl = document.getElementById('who');
let ME=null, ME_EMAIL="", IS_OWNER=false, VIEW='summary';
const esc = s => String(s==null?"":s).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
const usd = c => '$'+((c||0)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const mon = d => new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',year:'numeric'});
const render = h => wrap.innerHTML = h;
const shortId = u => (u||'').slice(0,8);

async function safe(promise){ try{ const r=await promise; if(r.error) return {data:[],err:r.error}; return {data:r.data||[],err:null}; }catch(e){ return {data:[],err:e}; } }

function viewLogin(msg){
  whoEl.textContent="";
  render(`<div class="card" style="max-width:420px;margin:30px auto">
    <h1 style="font-size:20px">Earnings logbook</h1>
    <p class="lede">Sign in with your Comp Desk login to see your skill earnings, statements, and payouts.</p>
    ${msg?`<div class="banner err">${esc(msg)}</div>`:""}
    <label>Email</label><input id="email" type="email" autocomplete="username">
    <label>Password</label><input id="pw" type="password" autocomplete="current-password">
    <div class="row"><button class="btn" id="go">Sign in</button></div>
  </div>`);
  go.onclick=doLogin; pw.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
}
async function doLogin(){
  const email=document.getElementById('email').value.trim(), password=document.getElementById('pw').value;
  go.disabled=true; go.textContent="Signing in…";
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error){viewLogin(error.message);return;} boot();
}

function statusPill(s){ return `<span class="pill ${esc(s)}">${esc(s)}</span>`; }

// ---------- contributor view ----------
async function contributorView(){
  const acct = (await safe(sb.from('contributor_accounts').select('*').eq('user_id',ME).maybeSingle()));
  const ledger = (await safe(sb.from('contributor_ledger').select('*').order('period_month',{ascending:false}))).data;
  const pays = (await safe(sb.from('payouts').select('*').order('created_at',{ascending:false}))).data;
  if(!ledger.length && !pays.length){
    render(`<h1>Your earnings</h1><p class="lede">Signed in as ${esc(ME_EMAIL)}</p>
      <div class="card"><p class="muted">No skill earnings recorded yet. Once one of your approved skills sells and the month closes, your 90% share will appear here with a monthly statement.</p></div>`);
    return;
  }
  const A = acct.data || {};
  const onboard = A.payouts_enabled ? '' :
    `<div class="banner warn">Payouts not enabled yet — finish your Stripe payout onboarding to receive your balance. Accrued earnings are held until then.</div>`;
  const earned = ledger.reduce((s,l)=>s+(l.builder_share_cents||0),0);
  const paid = ledger.filter(l=>l.status==='paid').reduce((s,l)=>s+(l.builder_share_cents||0),0);
  const accrued = ledger.filter(l=>l.status==='accrued'||l.status==='carried').reduce((s,l)=>s+(l.builder_share_cents||0),0);
  // group ledger by period
  const byP={}; ledger.forEach(l=>{(byP[l.period_month]=byP[l.period_month]||[]).push(l);});
  const stmts = Object.keys(byP).sort().reverse().map(p=>{
    const rows=byP[p];
    const g=rows.reduce((s,l)=>s+(l.gross_cents||0),0), co=rows.reduce((s,l)=>s+(l.apportioned_cost_cents||0),0),
      np=rows.reduce((s,l)=>s+(l.net_profit_cents||0),0), me=rows.reduce((s,l)=>s+(l.builder_share_cents||0),0);
    const st=rows.every(r=>r.status==='paid')?'paid':(rows.some(r=>r.status==='accrued')?'accrued':'carried');
    return `<tr><td>${esc(mon(p))}</td><td class="num">${usd(g)}</td><td class="num">${usd(co)}</td>
      <td class="num">${usd(np)}</td><td class="num">${usd(me)}</td><td>${statusPill(st)}</td></tr>`;
  }).join("");
  const payRows = pays.map(p=>`<tr><td>${esc(p.created_at?new Date(p.created_at).toLocaleDateString():'')}</td>
    <td class="num">${usd(p.amount_cents)}</td><td>${statusPill(p.status)}</td>
    <td class="muted">${esc(p.stripe_transfer_id||'—')}</td></tr>`).join("");
  render(`<h1>Your earnings</h1><p class="lede">Signed in as ${esc(ME_EMAIL)} · skills only · you earn 90% of net skill profit</p>
    ${onboard}
    <div class="stats">
      <div class="stat"><div class="v g">${usd(earned)}</div><div class="k">Total earned (90%)</div></div>
      <div class="stat"><div class="v">${usd(paid)}</div><div class="k">Paid out</div></div>
      <div class="stat"><div class="v o">${usd(accrued)}</div><div class="k">Pending / accrued</div></div>
    </div>
    <h2>Monthly statements</h2>
    <div class="card"><table><thead><tr><th>Month</th><th class="num">Gross</th><th class="num">Costs</th>
      <th class="num">Net profit</th><th class="num">Your 90%</th><th>Status</th></tr></thead><tbody>${stmts}</tbody></table></div>
    <h2>Payout history</h2>
    <div class="card">${payRows?`<table><thead><tr><th>Date</th><th class="num">Amount</th><th>Status</th><th>Transfer</th></tr></thead><tbody>${payRows}</tbody></table>`:'<p class="muted">No payouts yet.</p>'}</div>`);
}

// ---------- owner view ----------
async function ownerView(){
  const ledger = (await safe(sb.from('contributor_ledger').select('*').order('period_month',{ascending:false}))).data;
  const runs = (await safe(sb.from('payout_runs').select('*').order('period_month',{ascending:false}))).data;
  const accts = (await safe(sb.from('contributor_accounts').select('*'))).data;
  if(!ledger.length && !runs.length){
    render(ownerTabs()+`<div class="card"><p class="muted">No ledger activity yet. Once skills sell and you close a month, contributor earnings, the platform 10% share, and payout runs will appear here. (Run the payout-ledger setup prompt to initialize the schema.)</p></div>`);
    bindTabs(); return;
  }
  const builderOwed = ledger.filter(l=>l.status==='accrued'||l.status==='carried').reduce((s,l)=>s+(l.builder_share_cents||0),0);
  const builderPaid = ledger.filter(l=>l.status==='paid').reduce((s,l)=>s+(l.builder_share_cents||0),0);
  const platform = ledger.reduce((s,l)=>s+(l.platform_share_cents||0),0);
  const acctMap={}; accts.forEach(a=>acctMap[a.user_id]=a);
  // by contributor (open balance)
  const byC={}; ledger.forEach(l=>{(byC[l.contributor_id]=byC[l.contributor_id]||{earned:0,owed:0}); byC[l.contributor_id].earned+=l.builder_share_cents||0; if(l.status==='accrued'||l.status==='carried') byC[l.contributor_id].owed+=l.builder_share_cents||0;});
  const cRows = Object.keys(byC).map(cid=>{
    const a=acctMap[cid]||{}; const ok=a.payouts_enabled;
    return `<tr><td>${esc(shortId(cid))}…</td><td class="num">${usd(byC[cid].earned)}</td>
      <td class="num">${usd(byC[cid].owed)}</td>
      <td>${ok?'<span class="pill paid">payouts on</span>':'<span class="pill held">not onboarded</span>'}</td></tr>`;
  }).join("");
  const runRows = runs.map(r=>`<tr><td>${esc(mon(r.period_month))}</td><td>${statusPill(r.status)}</td>
    <td class="num">${usd(r.total_builder_cents)}</td><td class="num">${usd(r.total_platform_cents)}</td>
    <td class="muted">${esc(r.executed_at?new Date(r.executed_at).toLocaleDateString():'—')}</td></tr>`).join("");
  let body;
  if(VIEW==='contributors'){
    body=`<div class="card"><table><thead><tr><th>Contributor</th><th class="num">Total earned</th>
      <th class="num">Open balance</th><th>Payout status</th></tr></thead><tbody>${cRows||'<tr><td class="muted">none</td></tr>'}</tbody></table></div>`;
  } else if(VIEW==='runs'){
    body=`<div class="card"><table><thead><tr><th>Period</th><th>Status</th><th class="num">Builders (90%)</th>
      <th class="num">Platform (10%)</th><th>Executed</th></tr></thead><tbody>${runRows||'<tr><td class="muted">no runs</td></tr>'}</tbody></table></div>`;
  } else {
    body=`<div class="stats">
      <div class="stat"><div class="v o">${usd(builderOwed)}</div><div class="k">Owed to builders</div></div>
      <div class="stat"><div class="v">${usd(builderPaid)}</div><div class="k">Paid to builders</div></div>
      <div class="stat"><div class="v g">${usd(platform)}</div><div class="k">Platform retained (10%)</div></div>
      <div class="stat"><div class="v">${Object.keys(byC).length}</div><div class="k">Contributors with earnings</div></div>
    </div>
    <p class="muted">Calculators are excluded by design — this logbook reflects skill revenue share only.</p>`;
  }
  render(ownerTabs()+body); bindTabs();
}
function ownerTabs(){
  return `<h1>Earnings logbook — owner</h1><p class="lede">All contributors · skill revenue share · 90% builders / 10% platform</p>
    <div class="seg">
      <button data-v="summary" class="${VIEW==='summary'?'on':''}">Summary</button>
      <button data-v="contributors" class="${VIEW==='contributors'?'on':''}">By contributor</button>
      <button data-v="runs" class="${VIEW==='runs'?'on':''}">Payout runs</button>
    </div>`;
}
function bindTabs(){ document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{VIEW=b.dataset.v; ownerView();}); }

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ viewLogin(); return; }
  ME=session.user.id; ME_EMAIL=session.user.email; whoEl.textContent=ME_EMAIL;
  const {data:role}=await safe(sb.rpc('get_my_admin_role'));
  IS_OWNER = role==='owner';
  if(IS_OWNER) ownerView(); else contributorView();
}
boot();
</script>
</body>
</html>
