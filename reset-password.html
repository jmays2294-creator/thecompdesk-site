<!DOCTYPE html>
<html lang="en" data-audience="worker">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — The Comp Desk</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:var(--skin-surface);--card:var(--skin-surface-elev);--bd:var(--skin-divider);--ac:var(--skin-accent);--acD:var(--skin-accent-deep);--acG:rgba(232,119,34,0.12);--gn:#5BC79A;--rd:#ef4444;--tx:var(--skin-text);--txD:var(--skin-text-soft);--txM:var(--skin-text-muted);--wh:var(--skin-text);--font:var(--font-body,'DM Sans',system-ui,sans-serif);}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--tx);font-family:var(--font);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.auth-container{max-width:440px;width:100%;}
.logo{text-align:center;margin-bottom:28px;}
.logo .brand{font-size:11px;color:var(--ac);font-weight:700;letter-spacing:2px;text-transform:uppercase;}
.logo h1{font-size:28px;font-weight:800;color:var(--wh);margin-top:4px;}
.logo .sub{font-size:13px;color:var(--txM);margin-top:6px;}
.auth-card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:28px 24px;}
.auth-card h2{font-size:18px;font-weight:800;color:var(--wh);margin-bottom:6px;text-align:center;}
.auth-card .lede{font-size:13px;color:var(--txD);text-align:center;margin-bottom:18px;line-height:1.5;}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:11px;color:var(--txD);font-weight:600;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.5px;}
.form-group input{width:100%;padding:11px 14px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-size:14px;font-family:var(--font);outline:none;transition:border-color 0.2s;}
.form-group input:focus{border-color:var(--ac);}
.hint{font-size:11px;color:var(--txM);margin-top:5px;}
.submit-btn{width:100%;padding:13px;background:var(--ac);color:var(--wh);border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);margin-top:6px;transition:background 0.2s;}
.submit-btn:hover{background:var(--acD);}
.submit-btn:disabled{opacity:0.6;cursor:not-allowed;}
.msg{font-size:12px;margin-bottom:10px;min-height:18px;text-align:center;}
.msg.error{color:var(--rd);}
.msg.success{color:var(--gn);}
.back-link{display:block;text-align:center;margin-top:16px;font-size:13px;color:var(--txD);}
.back-link a{color:var(--ac);text-decoration:none;}
.back-link a:hover{text-decoration:underline;}
.center{text-align:center;}
.hidden{display:none;}
</style>
<link rel="stylesheet" href="/css/brand-theme.css">
<link rel="stylesheet" href="/css/skins.css">
<script src="/js/brand-bg.js" defer></script>
</head>
<body class="tcd-skinned">
<div class="auth-container">
  <div class="logo">
    <div class="brand">NYS Workers' Compensation</div>
    <h1>The Comp Desk</h1>
    <div class="sub">Reset your password</div>
  </div>

  <div class="auth-card" id="card">
    <!-- States rendered dynamically: verifying | form | invalid | done -->
    <p class="lede" id="boot">Verifying your reset link…</p>
  </div>

  <div class="back-link">
    <a href="/auth_v2.html">← Back to sign in</a>
  </div>
</div>

<script>
const SUPA_URL='https://ltibymvlytodkemdeeox.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0aWJ5bXZseXRvZGtlbWRlZW94Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4MjA1NjYsImV4cCI6MjA5MDM5NjU2Nn0.b5oQqQIdgJRc0DEP2k7kMVdCRzfyfnuAwjVNZlbVyak';
// detectSessionInUrl (default true) parses the recovery token from the URL hash
// that Supabase appends when the emailed link is followed, then fires the
// 'PASSWORD_RECOVERY' auth event. The link's redirect target
// (https://thecompdesk.com/reset-password.html) MUST be in Supabase Auth → URL
// Configuration → Redirect URLs — added in the Phase 0 manual step.
const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);

let recoveryReady=false;   // a PASSWORD_RECOVERY session has been established
let finished=false;        // a terminal state (done/invalid) has rendered

// ── Password policy — identical to Phase 1 (js/security.js) ───────────────
const PRIVILEGED_ADMIN_ROLES=['owner','builder','reviewer','marketplace_contributor'];
async function getIsPrivileged(){
  try{
    const{data,error}=await sb.rpc('get_my_admin_role');
    if(error)console.error('[security] ROLE_CHECK_FAILED',error);
    else if(data&&PRIVILEGED_ADMIN_ROLES.includes(data))return true;
  }catch(e){console.error('[security] ROLE_CHECK_FAILED',e);}
  try{
    const{data:tier,error}=await sb.rpc('get_my_entitlement');
    if(!error&&tier==='firm')return true;
  }catch(_){}
  return false;
}

// Phase 3 will deploy a `security-audit-log` Edge Function (service_role) as the
// only writer of auth_security_audit (client INSERT is blocked by RLS by design).
// Until then this is a forward-compatible stub: attempt the invoke, else mark loud.
async function logSecurityEvent(event,metadata={}){
  try{
    const{error}=await sb.functions.invoke('security-audit-log',{body:{event,surface:'web',metadata}});
    if(error)throw error;
    return true;
  }catch(err){
    console.warn(`[security] AUDIT_LOG_TODO event=${event} surface=web — security-audit-log edge fn not deployed yet; event not persisted.`,metadata);
    return false;
  }
}

const card=document.getElementById('card');

function renderForm(){
  finished=false;
  card.innerHTML=`
    <h2>Choose a new password</h2>
    <p class="lede">Enter a new password for your account.</p>
    <div class="msg" id="msg"></div>
    <div class="form-group">
      <label>New password</label>
      <input type="password" id="pw" autocomplete="new-password" placeholder="New password">
      <div class="hint" id="lenHint">Use at least 10 characters.</div>
    </div>
    <div class="form-group">
      <label>Confirm new password</label>
      <input type="password" id="pw2" autocomplete="new-password" placeholder="Confirm new password">
    </div>
    <button class="submit-btn" id="go" onclick="submitReset()">Update Password</button>
  `;
  // Reflect the stronger floor for privileged accounts (best-effort).
  getIsPrivileged().then(p=>{const h=document.getElementById('lenHint');if(p&&h)h.textContent='Use at least 12 characters (required for privileged accounts).';}).catch(()=>{});
  const pw=document.getElementById('pw');pw.focus();
  document.getElementById('pw2').addEventListener('keydown',e=>{if(e.key==='Enter')submitReset();});
}

function renderInvalid(detail){
  finished=true;
  card.innerHTML=`
    <h2>This link can't be used</h2>
    <p class="lede">${detail||'Your password reset link is invalid or has expired.'}</p>
    <button class="submit-btn" onclick="window.location.href='/auth_v2.html'">Request a new link</button>
  `;
}

function renderDone(){
  finished=true;
  card.innerHTML=`
    <h2>Password updated</h2>
    <p class="lede center">Your password has been changed. Redirecting you to sign in…</p>
  `;
}

async function submitReset(){
  const msg=document.getElementById('msg');
  const btn=document.getElementById('go');
  const pw=document.getElementById('pw').value;
  const pw2=document.getElementById('pw2').value;
  msg.textContent='';
  if(!pw||!pw2){msg.className='msg error';msg.textContent='Please fill in both password fields.';return;}
  if(pw!==pw2){msg.className='msg error';msg.textContent='Your new password and confirmation do not match.';return;}
  if(!recoveryReady){msg.className='msg error';msg.textContent='Your reset link is no longer active. Please request a new one.';return;}

  const privileged=await getIsPrivileged();
  const minLen=privileged?12:10;
  if(pw.length<minLen){
    msg.className='msg error';
    msg.textContent=`Your new password must be at least ${minLen} characters`+(privileged?' for privileged accounts.':'.');
    return;
  }

  btn.disabled=true;btn.textContent='Updating…';
  try{
    // Supabase also enforces its own min length + the HIBP leaked-password check
    // (already enabled); its rejection message is surfaced verbatim.
    const{error}=await sb.auth.updateUser({password:pw});
    if(error)throw error;
  }catch(err){
    console.error('[security] RESET_UPDATE_FAILED',err);
    msg.className='msg error';
    msg.textContent=(err&&err.message)?err.message:'We could not update your password. Please try again.';
    btn.disabled=false;btn.textContent='Update Password';
    return;
  }

  await logSecurityEvent('password_reset_completed',{privileged});
  // Force a fresh sign-in with the new password (also avoids the login page's
  // "already signed in" auto-redirect). Then route to login with a neutral toast.
  try{await sb.auth.signOut();}catch(e){console.error('[security] RESET_SIGNOUT_FAILED',e);}
  renderDone();
  setTimeout(()=>{window.location.href='/auth_v2.html?reset=success';},1500);
}

// ── Detect the recovery session ───────────────────────────────────────────
// 1) The supabase client fires PASSWORD_RECOVERY once it parses the URL hash.
sb.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY'&&session){
    recoveryReady=true;
    renderForm();
  }
});

// 2) Expired/invalid links arrive with an error in the URL hash
//    (e.g. #error=access_denied&error_code=otp_expired&error_description=...).
(function bootstrap(){
  const hash=window.location.hash?window.location.hash.replace(/^#/,''):'';
  const hp=new URLSearchParams(hash);
  if(hp.get('error')||hp.get('error_code')){
    const desc=(hp.get('error_description')||'').replace(/\+/g,' ');
    renderInvalid(desc?decodeURIComponent(desc):'Your password reset link is invalid or has expired.');
    return;
  }
  // 3) Fallback: if neither a recovery session nor an error materializes shortly
  //    (e.g. the page was opened directly without a token), show the invalid
  //    state with a path to request a fresh link.
  setTimeout(async()=>{
    if(recoveryReady||finished)return;
    try{
      const{data:{session}}=await sb.auth.getSession();
      if(session){recoveryReady=true;renderForm();return;}
    }catch(_){}
    renderInvalid('Your password reset link is invalid or has expired.');
  },2500);
})();
</script>
<script src="/js/disclaimer.js" defer></script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
