<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="/favicon.ico" sizes="any">

<title>Signing in… — The Comp Desk</title>
<meta name="robots" content="noindex">

<style>
:root{--bg:#06080f;--card:#0e1322;--bd:#1c2d4a;--ac:#4f8ff7;--ac-cta:#1d4ed8;--gn:#2dd4a0;--rd:#ef4444;--tx:#dce4f0;--txD:#8899b4;--txM:#5a6a82;--wh:#f4f6fa;--font:'DM Sans',system-ui,sans-serif;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--tx);font-family:var(--font);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.wrap{max-width:380px;width:100%;text-align:center;}
.spinner{width:40px;height:40px;border:3px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 20px;}
@keyframes spin{to{transform:rotate(360deg);}}
h2{font-size:20px;font-weight:700;color:var(--wh);margin-bottom:8px;}
p{font-size:14px;color:var(--txD);line-height:1.5;}
.error-box{background:#1a0a0a;border:1px solid rgba(239,68,68,0.3);border-radius:12px;padding:20px;margin-top:16px;display:none;}
.error-box .err-title{font-size:16px;font-weight:700;color:var(--rd);margin-bottom:8px;}
.error-box .err-msg{font-size:13px;color:var(--txD);margin-bottom:16px;}
.btn{display:inline-block;padding:11px 24px;background:var(--ac-cta);color:var(--wh);border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);text-decoration:none;}
</style>
<!-- Brand theme overlay (brand_guidelines.md v1.0.0) -->
<link rel="stylesheet" href="/css/brand-theme.css">
<script src="/js/brand-bg.js" defer></script>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-P1DQTVSWSM"></script>

  gtag('js', new Date());
  gtag('config', 'G-P1DQTVSWSM');
</script>
</head>
<body>
<div class="wrap">
  <div class="spinner" id="spinner"></div>
  <h2 id="title">Signing you in…</h2>
  <p id="subtitle">Just a moment while we verify your link.</p>

  <div class="error-box" id="error-box">
    <div class="err-title">Sign-in failed</div>
    <div class="err-msg" id="error-msg">The link may have expired or already been used.</div>
    <a href="/auth/login" class="btn" id="retry-link">Try again</a>
  </div>
</div>

<script>
const SUPA_URL = 'https://ltibymvlytodkemdeeox.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0aWJ5bXZseXRvZGtlbWRlZW94Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4MjA1NjYsImV4cCI6MjA5MDM5NjU2Nn0.b5oQqQIdgJRc0DEP2k7kMVdCRzfyfnuAwjVNZlbVyak';
const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);

const params  = new URLSearchParams(window.location.search);
const nextUrl = params.get('next') || '/account';

function showError(msg) {
  // Carry the destination back to the retry page, so a failed sign-in does not
  // also lose where the user was trying to go.
  const retry = document.getElementById('retry-link');
  if (retry) retry.href = '/auth/login?next=' + encodeURIComponent(nextUrl);
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('title').textContent = 'Something went wrong';
  document.getElementById('subtitle').style.display = 'none';
  const box = document.getElementById('error-box');
  box.style.display = 'block';
  if (msg) document.getElementById('error-msg').textContent = msg;
}

/**
 * Where does a freshly-authenticated user actually go?
 *
 * Magic-link users have always declared who they are at signup, so they go
 * straight to `next`. OAUTH USERS HAVE NOT: Google and Apple populate
 * raw_user_meta_data with their own claims only, so public.handle_new_user()
 * hits its COALESCE fallback and silently files EVERY social signup as
 * designation='worker' — attorneys included.
 *
 * Detection cannot be "designation IS NULL" — that COALESCE means designation is
 * never null. The honest signal is whether the user ever *declared* anything,
 * which is user_metadata.user_type: absent for OAuth, present for every email
 * signup. /auth/complete-profile writes it, so the question is asked once.
 */
function destinationFor(session) {
  try {
    const u  = session && session.user;
    const md = (u && u.user_metadata) || {};
    const provider = (u && u.app_metadata && u.app_metadata.provider) || '';
    const isSocial = provider === 'google' || provider === 'apple';
    const declared = !!md.user_type || md.tcd_onboarded === true;

    if (isSocial && !declared) {
      return '/auth/complete-profile?next=' + encodeURIComponent(nextUrl);
    }
  } catch (e) {
    // Fail OPEN — a bad read here must not strand a signed-in user.
    console.error('[callback] ROUTING_FAILED', e);
  }
  return nextUrl;
}

let routed = false;
function routeOnce(session, delayMs) {
  if (routed) return;
  routed = true;
  const dest = destinationFor(session);
  setTimeout(() => { window.location.replace(dest); }, delayMs || 0);
}

// Supabase sends the session tokens as a URL fragment (#access_token=...&refresh_token=...)
// after a magic-link click AND after the OAuth redirect — verified 2026-08-05:
// signInWithOAuth on this project emits no code_challenge, i.e. the implicit
// flow, so detectSessionInUrl consumes the fragment and no code exchange is
// needed. The ?code= branch below is a defensive no-op unless flowType is ever
// switched to 'pkce'.
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_IN' && session) {
    // Small delay so the "Signing you in…" message is briefly visible
    routeOnce(session, 600);
  }
});

// Fallback: check for an existing session (handles page reload after fragment consumed)
(async () => {
  // Defensive: if this project is ever switched to the PKCE flow, the provider
  // returns ?code= instead of a fragment and it must be exchanged explicitly.
  const code = params.get('code');
  if (code) {
    try {
      const { data, error: xErr } = await sb.auth.exchangeCodeForSession(code);
      if (xErr) { showError(xErr.message); return; }
      if (data && data.session) { routeOnce(data.session, 300); return; }
    } catch (e) {
      console.error('[callback] CODE_EXCHANGE_FAILED', e);
      showError('We could not complete sign-in. Please try again.');
      return;
    }
  }

  const { data: { session }, error } = await sb.auth.getSession();
  if (error) {
    showError(error.message);
    return;
  }
  if (session) {
    routeOnce(session, 0);
    return;
  }

  // Check for explicit error in fragment/query
  const hash   = new URLSearchParams(window.location.hash.slice(1));
  const errDesc = hash.get('error_description') || params.get('error_description');
  if (errDesc) {
    showError(decodeURIComponent(errDesc));
    return;
  }

  // If no session and no error after 5s, assume the link was bad.
  // `routed` guards the case where onAuthStateChange already fired and the
  // browser is mid-navigation — showing "expired" then would be a plain lie.
  setTimeout(() => {
    if (routed) return;
    const box = document.getElementById('error-box');
    if (box.style.display === 'none' || !box.style.display) {
      showError('The sign-in link may have expired. Please request a new one.');
    }
  }, 5000);
})();
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
