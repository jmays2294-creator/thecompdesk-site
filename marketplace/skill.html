<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill — The Comp Desk Marketplace</title>
<meta name="description" content="A purchasable Claude skill for NYS workers' compensation practice, on The Comp Desk marketplace.">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  :root{--bg:#0B1426;--panel:#0F1B33;--panel2:#151d30;--line:#1c2d4a;--ink:#eef3fb;--body:#c4cee0;
    --muted:#8899b4;--faint:#5a6a82;--orange:#E87722;--green:#2dd4a0;--blue:#3b82f6;--red:#ff6b6b;}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--body);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:var(--orange);text-decoration:none}a:hover{text-decoration:underline}
  .header{background:var(--bg);border-bottom:3px solid var(--orange);position:sticky;top:0;z-index:10}
  .header .inner{max-width:920px;margin:0 auto;padding:15px 22px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .wm{color:#fff;font-size:19px;font-weight:700}.wm .dot{color:var(--orange)}.wm .sub{color:var(--muted);font-size:13px;font-weight:500;margin-left:8px}
  .wrap{max-width:920px;margin:0 auto;padding:30px 22px 90px}
  h1{color:#fff;font-size:28px;margin:0 0 6px}
  .lede{color:var(--muted);font-size:15px;margin:0 0 22px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin:0 0 18px}
  .grid{display:grid;grid-template-columns:1fr;gap:18px}
  @media(min-width:820px){.grid{grid-template-columns:1.4fr 1fr}}
  video{width:100%;border-radius:12px;background:#000;border:1px solid var(--line)}
  .pricebox{text-align:center}
  .price{font-size:34px;font-weight:800;color:#fff;line-height:1}
  .price .cents{font-size:18px;color:var(--muted)}
  .btn{display:inline-block;border:none;border-radius:10px;padding:14px 24px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;width:100%}
  .btn-primary{background:var(--orange);color:var(--bg)}.btn-primary:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .kindpill{display:inline-block;border-radius:999px;padding:3px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);margin-bottom:12px}
  ol.steps{padding-left:0;list-style:none;counter-reset:s;margin:10px 0 0}
  ol.steps li{counter-increment:s;position:relative;padding:8px 0 8px 40px;border-top:1px solid var(--line);color:var(--body)}
  ol.steps li:first-child{border-top:none}
  ol.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:26px;height:26px;border-radius:50%;background:var(--panel2);border:1.5px solid var(--orange);color:var(--orange);font-weight:700;font-size:13px;display:grid;place-items:center}
  .muted{color:var(--muted);font-size:13px}
  .banner{border-radius:10px;padding:13px 16px;margin-bottom:16px;font-size:14px}
  .banner.err{background:#2a1518;border:1px solid var(--red);color:#ffc9c9}
  .banner.note{background:#11203a;border:1px solid var(--blue);color:#bcd4ff}
  .disc{color:var(--faint);font-size:12px;margin-top:22px;line-height:1.5}
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-P1DQTVSWSM"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-P1DQTVSWSM');
</script>
</head>
<body>
  <div class="header"><div class="inner">
    <a href="/marketplace" class="wm" style="text-decoration:none">The Comp Desk<span class="dot">.</span><span class="sub">Marketplace</span></a>
    <a href="/marketplace" class="muted">← All skills</a>
  </div></div>
  <div class="wrap" id="wrap"><div class="card"><p class="muted">Loading…</p></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://ltibymvlytodkemdeeox.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0aWJ5bXZseXRvZGtlbWRlZW94Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4MjA1NjYsImV4cCI6MjA5MDM5NjU2Nn0.b5oQqQIdgJRc0DEP2k7kMVdCRzfyfnuAwjVNZlbVyak";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const wrap = document.getElementById('wrap');
const esc = s => String(s==null?"":s).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
const slug = new URLSearchParams(location.search).get('slug') || '';
const money = c => '$' + (Math.floor(c/100)) + '.' + String(c%100).padStart(2,'0');

function stepsHTML(steps){
  let arr = [];
  try { arr = Array.isArray(steps) ? steps : (steps ? JSON.parse(steps) : []); } catch(_) { arr = []; }
  if(!arr.length) return '<p class="muted">The contributor hasn’t added a step breakdown yet.</p>';
  const li = arr.map(s => {
    if(s && typeof s === 'object') return `<li><b style="color:#fff">${esc(s.title||s.step||'')}</b>${s.detail?'<br>'+esc(s.detail):''}</li>`;
    return `<li>${esc(s)}</li>`;
  }).join('');
  return `<ol class="steps">${li}</ol>`;
}

async function buy(listing){
  const btn = document.getElementById('buyBtn');
  btn.disabled = true; btn.textContent = 'Starting checkout…';
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){
    // send them to sign in, then back here
    location.href = '/auth?redirect=' + encodeURIComponent(location.pathname + location.search);
    return;
  }
  const { data, error } = await sb.functions.invoke('create-listing-checkout', { body: { listing_id: listing.id } });
  if(error || !data?.checkout_url){
    btn.disabled = false; btn.textContent = 'Buy this skill';
    document.getElementById('buyErr').textContent = (error?.message || data?.error || 'Could not start checkout.');
    return;
  }
  location.href = data.checkout_url;
}

async function boot(){
  if(!slug){ wrap.innerHTML = `<div class="card"><div class="banner err">No skill specified.</div></div>`; return; }
  const { data: listing, error } = await sb.from('skill_listings')
    .select('id, kind, slug, display_name, description, steps, price_cents, status')
    .eq('slug', slug).eq('status','listed').maybeSingle();
  if(error){ wrap.innerHTML = `<div class="card"><div class="banner err">${esc(error.message)}</div></div>`; return; }
  if(!listing){ wrap.innerHTML = `<div class="card"><h1>Not found</h1><p class="lede">This skill isn’t available. <a href="/marketplace">Back to the marketplace →</a></p></div>`; return; }
  document.title = listing.display_name + ' — The Comp Desk Marketplace';

  const isCalc = listing.kind === 'calculator';
  wrap.innerHTML = `
    <span class="kindpill">${isCalc ? 'Calculator' : 'Claude skill'}</span>
    <h1>${esc(listing.display_name)}</h1>
    <p class="lede">${esc(listing.description)}</p>
    ${isCalc ? '<div class="banner note">This is a calculator. Approved calculators normally ship inside <b>Pro</b> at no extra cost — this standalone purchase is offered for buyers who only want this tool.</div>' : ''}
    <div class="grid">
      <div>
        <div class="card"><div class="muted" style="text-transform:uppercase;letter-spacing:1px;font-size:12px;margin-bottom:8px">Watch it work</div>
          <div id="demoBox"><p class="muted">Loading demo…</p></div></div>
        <div class="card"><div class="muted" style="text-transform:uppercase;letter-spacing:1px;font-size:12px;margin-bottom:4px">How it works</div>
          ${stepsHTML(listing.steps)}</div>
      </div>
      <div>
        <div class="card pricebox">
          <div class="price">${money(listing.price_cents)}</div>
          <p class="muted" style="margin:6px 0 16px">One-time purchase</p>
          <button class="btn btn-primary" id="buyBtn">Buy this ${isCalc?'calculator':'skill'}</button>
          <div id="buyErr" class="banner err" style="display:${''};margin-top:12px;${''}"></div>
          <p class="muted" style="margin-top:14px">You’ll sign in with your Comp Desk account at checkout.</p>
        </div>
      </div>
    </div>
    <p class="disc">The Comp Desk is operated by NJJ Document Services, Inc. Skills are software tools and do not constitute legal advice. Seller of record is NJJ Document Services, Inc.</p>`;
  // hide error box until used
  const be = document.getElementById('buyErr'); be.style.display='none';
  document.getElementById('buyBtn').onclick = () => buy(listing);

  // signed demo URL via the edge function (bucket is private)
  try {
    const { data: pb } = await sb.functions.invoke('skill-demo', { body: { action:'playback', listing_id: listing.id } });
    const box = document.getElementById('demoBox');
    if(pb?.url){ box.innerHTML = `<video controls preload="metadata" playsinline src="${pb.url}"></video>`; }
    else { box.innerHTML = `<p class="muted">No demo video available.</p>`; }
  } catch(_) { document.getElementById('demoBox').innerHTML = `<p class="muted">No demo video available.</p>`; }
}
boot();
</script>
</body>
</html>
